services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      # 容器内运行 QQ 的用户 id（Linux 下用 `id -u` / `id -g` 填）
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
      # WebUI 登录令牌，务必改成随机长串
      - WEBUI_TOKEN=${WEBUI_TOKEN:-change-me-please}
    ports:
      # 只绑本机，不要暴露公网
      - "127.0.0.1:3000:3000"   # OneBot HTTP/WS，qce 连这个
      - "127.0.0.1:6099:6099"   # NapCat WebUI（看二维码 / 改配置）
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/qq:/app/.config/QQ
